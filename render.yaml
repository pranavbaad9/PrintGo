services:
  - type: web
    name: printgo-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: ~18.0.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: printgo-db
          property: connectionString
      - key: CASHFREE_APP_ID
        sync: false # Set this in Render Dashboard after deployment
      - key: CASHFREE_SECRET_KEY
        sync: false # Set this in Render Dashboard after deployment
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        generateValue: true

databases:
  - name: printgo-db
    databaseName: printgo
    user: printgo_user
    plan: free
